name: CI

# Every push to main and every pull request runs the same gate on all three
# operating systems. `make verify` is the local equivalent.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04: oldest glibc/webkit we support, same as the release build.
        os: [ubuntu-22.04, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      # main.go embeds frontend/dist, so the frontend must exist before go vet/test.
      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npm run build

      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l . | grep -v node_modules)" || { gofmt -l .; exit 1; }

      - name: go vet
        run: go vet -tags webkit2_41 ./...

      - name: go test
        run: go test -tags webkit2_41 ./internal/... ./tools/...
