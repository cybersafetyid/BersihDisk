root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -tags dev -ldflags \"-X main.appVersion=dev\" -o ./tmp/bersihdisk ."
  bin = "./tmp/bersihdisk"
  include_ext = ["go"]
  exclude_dir = ["frontend", "build", "tmp", "vendor", ".git"]
  exclude_regex = ["_test\\.go$"]
  delay = 500
  stop_on_error = true
  send_interrupt = true
  kill_delay = "500ms"

[log]
  time = false

[misc]
  clean_on_exit = true
